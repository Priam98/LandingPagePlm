<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Portal - Plant P4</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="css/admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>

<body>

    <!-- ======================================================
         LOGIN
         ====================================================== -->

    <section id="loginView" class="view login-view">

        <div class="login-card">

            <div class="login-logo">
                <img src="logo.png" alt="Logo Plant P4">
            </div>

            <h1>Admin Portal</h1>

            <p class="muted">
                Plant P4 Palembang
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Masuk
                </button>

            </form>

            <p id="loginMessage" class="message"></p>

            <a href="index.html" class="back-link">
                ← Kembali ke Portal
            </a>

        </div>

    </section>


    <!-- ======================================================
         ADMIN APP
         ====================================================== -->

    <section id="adminView" class="view admin-view hidden">

        <header class="admin-header">

            <div>

                <div class="brand">
                    <img src="logo.png" alt="Logo">
                    <div>
                        <strong>Admin Portal</strong>
                        <span>Plant P4 Palembang</span>
                    </div>
                </div>

            </div>

            <div class="header-actions">

                <span id="currentUser" class="current-user"></span>

                <a href="index.html" class="btn btn-secondary">
                    Portal
                </a>

                <button
                    id="logoutBtn"
                    type="button"
                    class="btn btn-danger"
                >
                    Logout
                </button>

            </div>

        </header>


        <main class="admin-container">

            <!-- ==================================================
                 DASHBOARD SUMMARY
                 ================================================== -->

            <section class="summary-grid">

                <div class="summary-card">
                    <span>Cards</span>
                    <strong id="cardCount">0</strong>
                </div>

                <div class="summary-card">
                    <span>Groups</span>
                    <strong id="groupCount">0</strong>
                </div>

                <div class="summary-card">
                    <span>Links</span>
                    <strong id="linkCount">0</strong>
                </div>

            </section>


            <!-- ==================================================
                 STATUS
                 ================================================== -->

            <div id="globalMessage" class="global-message"></div>


            <!-- ==================================================
                 CARD MANAGEMENT
                 ================================================== -->

            <section class="panel">

                <div class="panel-header">

                    <div>
                        <h2>Cards</h2>
                        <p>
                            Kelola menu utama portal.
                        </p>
                    </div>

                    <button
                        id="addCardBtn"
                        type="button"
                        class="btn btn-primary"
                    >
                        + Tambah Card
                    </button>

                </div>

                <div
                    id="cardsContainer"
                    class="data-list"
                ></div>

            </section>


            <!-- ==================================================
                 GROUP MANAGEMENT
                 ================================================== -->

            <section class="panel">

                <div class="panel-header">

                    <div>
                        <h2>Groups</h2>
                        <p>
                            Kelola kelompok link dan tahun.
                        </p>
                    </div>

                    <button
                        id="addGroupBtn"
                        type="button"
                        class="btn btn-primary"
                    >
                        + Tambah Group
                    </button>

                </div>

                <div
                    id="groupsContainer"
                    class="data-list"
                ></div>

            </section>


            <!-- ==================================================
                 LINK MANAGEMENT
                 ================================================== -->

            <section class="panel">

                <div class="panel-header">

                    <div>
                        <h2>Links</h2>
                        <p>
                            Kelola tautan yang tampil di portal.
                        </p>
                    </div>

                    <button
                        id="addLinkBtn"
                        type="button"
                        class="btn btn-primary"
                    >
                        + Tambah Link
                    </button>

                </div>

                <div
                    id="linksContainer"
                    class="data-list"
                ></div>

            </section>

        </main>

    </section>


    <!-- ======================================================
         MODAL
         ====================================================== -->

    <div
        id="modal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div class="modal-backdrop"></div>

        <div class="modal-dialog">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Form
                </h2>

                <button
                    id="closeModalBtn"
                    type="button"
                    class="modal-close"
                    aria-label="Tutup"
                >
                    ×
                </button>

            </div>

            <form id="crudForm">

                <div id="modalBody"></div>

                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelModalBtn"
                        class="btn btn-secondary"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Simpan
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="admin.js"></script>

</body>

</html>
