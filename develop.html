<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — Plant P4</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        .coming-wrap {
            min-height: calc(100vh - 52px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .coming-card {
            width: min(420px, 100%);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-bar);
            padding: 28px 24px;
            text-align: center;
        }
        .coming-card img {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            object-fit: contain;
        }
        .coming-card h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--title);
            margin-bottom: 8px;
        }
        .coming-card p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .coming-card a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 16px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .coming-card a:hover {
            background: var(--accent-bright);
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>
    <nav class="page-nav">
        <div class="page-nav-inner">
            <a class="page-brand" href="index.html"><img src="logo.png" alt="Logo"><span>Plant P4</span></a>
            <button id="themeBtn" type="button" aria-label="Ganti tema">🌙</button>
        </div>
    </nav>
    <div class="coming-wrap">
        <div class="coming-card">
            <img src="logo.png" alt="Logo">
            <h1>Coming Soon</h1>
            <p>Halaman ini masih dalam pengembangan.</p>
            <a href="index.html">Kembali ke Portal</a>
        </div>
    </div>
    <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="Kembali ke atas">↑</button>

    <script src="page-theme.js"></script>
    <script src="motion.js"></script>
</body>
</html>
